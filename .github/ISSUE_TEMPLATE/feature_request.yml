name: Feature request
description: Propose a focused platform improvement.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What should become possible? Use a generic or synthetic example.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe expected behavior and how to verify it.
    validations:
      required: true

http:
  routers:
    upload:
      entryPoints: [web]
      rule: PathRegexp(`^/api/collections/[^/]+/upload$`)
      priority: 100
      service: api
      middlewares: [upload-limit, headers]
    api:
      priority: 10
      entryPoints: [web]
      rule: PathPrefix(`/`)
      service: api
      middlewares: [body-limit, headers]
  services:
    api:
      loadBalancer:
        servers:
          - url: http://api:8000
  middlewares:
    upload-limit:
      buffering:
        maxRequestBodyBytes: 11000000
    body-limit:
      buffering:
        maxRequestBodyBytes: 65536
    headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
        customResponseHeaders:
          Content-Security-Policy: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

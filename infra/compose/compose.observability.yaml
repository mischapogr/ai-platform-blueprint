x-observe: &observe
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: '2'

services:
  prometheus:
    <<: *observe
    image: prom/prometheus:v3.7.3
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=24h]
    volumes:
      - ../../observability/prometheus:/etc/prometheus:ro
      - ../../observability/alerts:/etc/platform-alerts:ro
      - prometheus:/prometheus
    ports: ['127.0.0.1:9090:9090']
    networks: [telemetry, management]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 12

  loki:
    <<: *observe
    image: ai-platform-blueprint-loki:local
    build:
      context: ../..
      dockerfile: observability/loki/Dockerfile
    command: [-config.file=/etc/loki/config.yml]
    volumes:
      - ../../observability/loki/loki.yml:/etc/loki/config.yml:ro
      - loki:/loki
    networks: [telemetry]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD, /bin/busybox, wget, -q, -O, /dev/null, 'http://localhost:3100/ready']
      interval: 5s
      timeout: 3s
      retries: 18

  alloy:
    <<: *observe
    image: ai-platform-blueprint-alloy:local
    build:
      context: ../..
      dockerfile: observability/alloy/Dockerfile
    user: alloy
    command: [run, --storage.path=/var/lib/alloy/data, /etc/alloy/config.alloy]
    volumes:
      - ../../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - api_logs:/var/log/platform:ro
      - alloy:/var/lib/alloy
    networks: [telemetry]
    mem_limit: 192m
    cpus: 0.5
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: [CMD, /bin/busybox, wget, -q, -O, /dev/null, 'http://localhost:12345/-/ready']
      interval: 5s
      timeout: 3s
      retries: 12

  grafana:
    <<: *observe
    image: grafana/grafana:12.2.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    secrets: [grafana_password]
    tmpfs: ['/tmp:size=32m,mode=1777']
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports: ['127.0.0.1:3000:3000']
    networks: [telemetry, management]
    mem_limit: 384m
    cpus: 0.5
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 18

volumes:
  prometheus:
  loki:
  alloy:
  grafana:
secrets:
  grafana_password:
    file: ../../.secrets/grafana_password

networks:
  management:

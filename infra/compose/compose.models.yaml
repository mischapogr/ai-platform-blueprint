services:
  api:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODELS: llama3.2:3b
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text:latest
      OLLAMA_EMBEDDING_PROFILE: nomic-v1
    networks:
      models: {}
  worker:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODELS: llama3.2:3b
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text:latest
      OLLAMA_EMBEDDING_PROFILE: nomic-v1
    networks:
      models: {}
  ollama:
    image: ai-platform-blueprint-ollama:local
    build:
      context: ../..
      dockerfile: observability/ollama/Dockerfile
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:size=32m,mode=1777']
    volumes: [ollama_models:/models]
    networks: [models, egress]
    mem_limit: 6g
    cpus: 4
    pids_limit: 256
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '8192'
    restart: unless-stopped
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
networks:
  models:
    internal: true
volumes:
  ollama_models:

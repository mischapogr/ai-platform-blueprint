x-defaults: &defaults
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: '2'

services:
  db:
    <<: *defaults
    image: pgvector/pgvector:0.8.1-pg16-bookworm
    # PostgreSQL entrypoint needs these to initialize and drop privileges.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password, app_password]
    volumes:
      - database:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    networks: [backend]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U platform_admin -d platform']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    <<: *defaults
    image: ai-platform-blueprint-api:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    read_only: true
    # Keep musl resolver retries below the 4s Prometheus scrape timeout when DB DNS disappears.
    dns_opt: ['timeout:1', 'attempts:1']
    tmpfs: ['/tmp:size=16m,mode=1777']
    environment:
      DB_HOST: db
      DB_PASSWORD_FILE: /run/secrets/app_password
      REQUEST_LOG: /var/log/platform/requests.jsonl
      REDIS_HOST: redis
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      WORKSPACE_TOKEN_FILE: /run/secrets/workspace_token
    secrets: [app_password, workspace_token, openai_api_key]
    volumes: [api_logs:/var/log/platform]
    networks: [backend, telemetry, edge]
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 3

  redis:
    <<: *defaults
    image: redis:7.4.2-alpine
    user: '999:999'
    read_only: true
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 32mb, --maxmemory-policy, allkeys-lru]
    networks: [backend]
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 2s
      retries: 12

  worker:
    <<: *defaults
    image: ai-platform-blueprint-api:local
    command: [python, /app/worker/main.py]
    environment:
      PYTHONPATH: /app
      REDIS_HOST: redis
      DB_HOST: db
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets: [app_password, openai_api_key]
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    networks: [backend, egress]
    mem_limit: 768m
    cpus: 1
    pids_limit: 64
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import redis,time; r=redis.Redis(host='redis',socket_timeout=2); h=r.get('kb:heartbeat'); assert h and time.time()-float(h)<210"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  traefik:
    <<: *defaults
    image: traefik:v3.6.1
    user: '65532:65532'
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    command:
      - --entrypoints.web.address=:8080
      - --providers.file.filename=/etc/traefik/routes.yml
      - --ping=true
      - --entrypoints.traefik.address=:8082
      - --log.level=WARN
    ports: ['127.0.0.1:8080:8080']
    volumes: [./traefik/routes.yml:/etc/traefik/routes.yml:ro]
    networks: [edge]
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping, --entrypoints.traefik.address=:8082]
      interval: 5s
      timeout: 3s
      retries: 6

volumes:
  database:
  api_logs:
networks:
  egress:
  edge:
  backend:
    internal: true
  telemetry:
    internal: true
secrets:
  db_password:
    file: ../../.secrets/db_password
  app_password:
    file: ../../.secrets/app_password
  workspace_token:
    file: ../../.secrets/workspace_token
  openai_api_key:
    file: ../../.secrets/openai_api_key

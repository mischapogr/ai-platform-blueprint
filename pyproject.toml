[project]
name = "ai-platform-blueprint"
version = "0.1.0"
description = "Local operating reference for a small AI application"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "prometheus-client>=0.21,<1",
  "cryptography>=50,<51",
  "openai>=3.35,<4",
  "httpx>=0.28,<1",
  "redis>=7.4,<9",
  "pypdf>=6.21,<8",
  "beautifulsoup4>=4.13,<5",
  "python-multipart>=0.0.22,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101"]
